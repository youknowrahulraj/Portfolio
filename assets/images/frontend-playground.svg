<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Frontend Playground</title>
  <desc id="desc">Dark themed vector illustration of a frontend development playground with HTML, CSS, JavaScript and code editor UI.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d0e11"/>
      <stop offset="1" stop-color="#15161a"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000" flood-opacity=".45"/>
    </filter>
  </defs>

  <rect width="1200" height="700" rx="28" fill="url(#bg)"/>
  <rect x="22" y="22" width="1156" height="656" rx="24" fill="none" stroke="#303139" stroke-width="2"/>

  <!-- dotted connections -->
  <path d="M190 190 C270 120 330 160 390 245" fill="none" stroke="#ef3340" stroke-width="3" stroke-dasharray="6 10"/>
  <path d="M820 225 C900 130 1010 150 1035 245" fill="none" stroke="#ef3340" stroke-width="3" stroke-dasharray="6 10"/>
  <path d="M170 470 C250 550 320 510 380 430" fill="none" stroke="#ef3340" stroke-width="3" stroke-dasharray="6 10"/>

  <!-- badges -->
  <g font-family="Arial, sans-serif" font-size="26" font-weight="600" fill="#e7e7ea">
    <g transform="rotate(-8 190 165)">
      <rect x="115" y="125" width="150" height="75" rx="18" fill="#141519" stroke="#3b3d47" stroke-width="2"/>
      <text x="140" y="173">HTML</text>
    </g>
    <g transform="rotate(-7 245 420)">
      <rect x="175" y="380" width="140" height="75" rx="18" fill="#141519" stroke="#3b3d47" stroke-width="2"/>
      <text x="204" y="428">CSS</text>
    </g>
    <g transform="rotate(7 1000 175)">
      <rect x="935" y="135" width="130" height="75" rx="18" fill="#141519" stroke="#3b3d47" stroke-width="2"/>
      <text x="973" y="183">JS</text>
    </g>
    <g transform="rotate(8 1010 420)">
      <rect x="925" y="380" width="170" height="75" rx="18" fill="#141519" stroke="#3b3d47" stroke-width="2"/>
      <text x="953" y="428">&lt;/&gt;</text>
    </g>
  </g>

  <!-- main browser/editor -->
  <g filter="url(#shadow)">
    <rect x="350" y="150" width="500" height="370" rx="24" fill="#111216" stroke="#3b3d47" stroke-width="3"/>
    <line x1="350" y1="210" x2="850" y2="210" stroke="#30323b" stroke-width="2"/>
    <circle cx="382" cy="180" r="9" fill="#ef3340"/>
    <circle cx="412" cy="180" r="9" fill="#626570"/>
    <circle cx="442" cy="180" r="9" fill="#3e4048"/>

    <!-- code panel -->
    <rect x="380" y="240" width="205" height="235" rx="15" fill="#15161b" stroke="#30323b" stroke-width="2"/>
    <text x="405" y="278" font-family="monospace" font-size="38" font-weight="700" fill="#ef3340">&lt;/&gt;</text>
    <rect x="405" y="305" width="70" height="10" rx="5" fill="#ef3340"/>
    <rect x="485" y="305" width="55" height="10" rx="5" fill="#50525b"/>
    <rect x="405" y="330" width="105" height="10" rx="5" fill="#ef3340"/>
    <rect x="520" y="330" width="35" height="10" rx="5" fill="#454750"/>
    <rect x="405" y="355" width="75" height="10" rx="5" fill="#c74a55"/>
    <rect x="490" y="355" width="60" height="10" rx="5" fill="#555760"/>
    <rect x="405" y="380" width="130" height="10" rx="5" fill="#555760"/>
    <rect x="405" y="405" width="85" height="10" rx="5" fill="#ef3340"/>
    <rect x="500" y="405" width="50" height="10" rx="5" fill="#44464e"/>
    <rect x="405" y="430" width="105" height="10" rx="5" fill="#555760"/>

    <!-- preview panel -->
    <rect x="615" y="240" width="205" height="235" rx="15" fill="#15161b" stroke="#30323b" stroke-width="2"/>
    <rect x="642" y="265" width="151" height="88" rx="10" fill="#202229" stroke="#4b4e59" stroke-width="2"/>
    <path d="M655 335 L688 295 L716 320 L738 302 L780 335Z" fill="#727681"/>
    <circle cx="759" cy="285" r="12" fill="#8a8e98"/>
    <rect x="642" y="375" width="125" height="11" rx="5" fill="#555760"/>
    <rect x="642" y="399" width="145" height="11" rx="5" fill="#44464e"/>
    <rect x="642" y="425" width="75" height="30" rx="9" fill="#ef3340"/>
  </g>

  <!-- floating control card -->
  <g transform="rotate(-7 735 530)" filter="url(#shadow)">
    <rect x="610" y="485" width="300" height="105" rx="18" fill="#15161b" stroke="#3b3d47" stroke-width="3"/>
    <circle cx="640" cy="520" r="13" fill="#ef3340"/>
    <circle cx="675" cy="520" r="13" fill="#191a20" stroke="#4b4d58" stroke-width="3"/>
    <circle cx="710" cy="520" r="13" fill="#191a20" stroke="#4b4d58" stroke-width="3"/>
    <rect x="635" y="550" width="170" height="12" rx="6" fill="#3f414a"/>
    <circle cx="805" cy="556" r="17" fill="#ef3340"/>
    <rect x="830" y="540" width="52" height="28" rx="14" fill="#24262d" stroke="#686b76" stroke-width="2"/>
    <circle cx="865" cy="554" r="11" fill="#ef3340"/>
  </g>

  <!-- decorative cursor -->
  <g transform="translate(255 555)">
    <path d="M0 0 L18 65 L32 43 L53 61 L62 52 L41 34 L65 29 Z" fill="#f2f2f4" stroke="#111216" stroke-width="3"/>
    <path d="M8 -8 L1 -24 M25 -12 L30 -28 M-5 8 L-25 4" stroke="#ef3340" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- sparkles/dots -->
  <path d="M285 95 l8 20 20 8-20 8-8 20-8-20-20-8 20-8z" fill="#ef3340"/>
  <circle cx="1005" cy="305" r="7" fill="#ef3340"/>
  <circle cx="1070" cy="330" r="10" fill="#353740"/>
  <circle cx="145" cy="300" r="9" fill="#ef3340"/>
  <circle cx="315" cy="575" r="6" fill="#555760"/>
</svg>
